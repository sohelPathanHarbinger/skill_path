# Publishes the CloudeAI branch (the web app without PWA) to GitHub Pages:
# https://sohelpathanharbinger.github.io/skill_path/
# The PWA lives on the feature/pwa-app branch and is hosted on Vercel instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [CloudeAI]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site from /skill_path/ (the repository name).
      - run: npm run build -- --base=/skill_path/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
